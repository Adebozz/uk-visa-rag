[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visa-rag"
version = "0.1.0"
description = "UK visa & immigration assistant - production RAG with hybrid retrieval and an evaluation suite"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.34",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "streamlit>=1.36",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
